<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    card: {
                        base: ' p-4 bg-white',
                        header: 'text-lg font-bold mb-2',
                        body: 'text-sm text-gray-700',
                        footer: 'text-sm text-gray-500',
                    },
                    button: {
                        primary: 'bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600',
                        secondary: 'bg-gray-500 text-white py-2 px-4 rounded hover:bg-gray-600',
                    },
                }
            }
        }
    </script>
</head>

<body>
    <div class="shadow-md rounded-lg p-4 bg-white">
        <div class="text-lg font-bold mb-2">Card Header</div>
        <div class="text-sm text-gray-700">
          Questo è il contenuto della card.
        </div>
        <div class="text-sm text-gray-500 mt-2">
          <button class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
            Pulsante Primario
          </button>
          <button class="bg-gray-500 text-white py-2 px-4 rounded hover:bg-gray-600">
            Pulsante Secondario
          </button>
        </div>
      </div>
</body>

</html>
